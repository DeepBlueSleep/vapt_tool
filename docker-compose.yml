services:
  api:
    build: .
    environment:
      ASSESSMENT_DATABASE_URL: sqlite+aiosqlite:////data/platform.db
      ASSESSMENT_OUTPUT_DIR: /data/artifacts
      ASSESSMENT_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - platform-data:/data

  web:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./platform/web:/app
    depends_on:
      - api

volumes:
  platform-data:
