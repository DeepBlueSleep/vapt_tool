[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-website-scanner"
version = "0.2.0"
description = "Safe asynchronous website security assessment framework"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
platform = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.19",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "weasyprint>=61.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
safe-website-scanner = "scanner.cli:main"
assessment-platform = "platform.api.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.setuptools.packages.find]
include = ["scanner*", "platform*"]
