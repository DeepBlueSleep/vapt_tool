name = "runtime-assessment-platform"
compatibility_date = "2026-06-02"
main = "worker/index.ts"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Optional. When set, the Worker records scans in Neon and forwards scan creation
# to the Python assessment API. Leave blank for metadata-only edge operation.
SCANNER_API_URL = ""
