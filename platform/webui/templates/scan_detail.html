{% extends "base.html" %}
{% block title %}Scan {{ scan.id }} - Assessment Platform{% endblock %}
{% block content %}
<div class="mb-5 flex flex-wrap items-start justify-between gap-3">
  <div>
    <p class="text-sm text-slate-500 dark:text-slate-400">Scan {{ scan.id }}</p>
    <h1 class="break-all text-2xl font-semibold">{{ scan.target_url }}</h1>
  </div>
  <div class="flex flex-wrap gap-2">
    <a class="btn-secondary" href="/">Dashboard</a>
    <a class="btn-primary" href="/reports/{{ scan.id }}">View Results</a>
    <form method="post" action="/scan/{{ scan.id }}/delete" onsubmit="return confirm('Delete this scan and generated report artifacts?')">
      <button class="btn-secondary" type="submit">Delete Scan</button>
    </form>
  </div>
</div>
<p id="scan-refresh-message" role="status" class="mb-3 text-sm"></p>
{% include "partials/scan_status.html" %}
{% endblock %}
